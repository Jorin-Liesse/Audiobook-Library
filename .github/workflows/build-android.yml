name: Build Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      NDK_VERSION: '28.2.13676358'
      # Native debug symbols multiply disk use across the four Android ABIs.
      CARGO_PROFILE_DEV_DEBUG: '0'

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Free disk space for Android build
        run: |
          df -h /
          # Remove large hosted-runner tools that this Android job does not use.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /usr/local/lib/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          # Keep the selected NDK; sdkmanager below installs it if it is missing.
          for ndk in "$ANDROID_HOME"/ndk/*; do
            if [[ "$(basename "$ndk")" != "$NDK_VERSION" ]]; then
              sudo rm -rf -- "$ndk"
            fi
          done
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-no-debug-symbols

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Lint frontend
        run: npm run lint

      - name: Test library and playback
        run: npm test

      - name: Initialize Android project
        if: ${{ hashFiles('src-tauri/gen/android/gradlew') == '' }}
        run: npm run tauri -- android init --ci --skip-targets-install

      # Apply custom launcher icons after initialization creates the Android resources.
      - name: Generate app icons
        run: npm run tauri -- icon static/favicon.png

      - name: Configure local media access
        run: node scripts/configure-android-network.mjs --android

      - name: Report disk usage before Android build
        run: |
          df -h /
          du -sh src-tauri/target "$HOME/.gradle" "$ANDROID_HOME/ndk" 2>/dev/null || true

      # Android automatically signs debug APKs with a generated debug key.
      - name: Build Android debug APK
        run: npm run tauri -- android build --ci --debug --apk

      - name: Upload Android debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: audiobook-library-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
