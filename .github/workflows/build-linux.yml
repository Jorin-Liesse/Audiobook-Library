name: Build Linux

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-x64

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2 file xdg-utils

      # No npm lockfile is currently committed, so npm ci cannot be used.
      - name: Install frontend dependencies
        run: npm install

      - name: Check frontend
        run: npm run check

      - name: Build Linux packages
        run: npm run tauri -- build --ci --bundles deb,appimage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: audiobook-library-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
